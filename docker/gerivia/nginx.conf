# Gerivia: cliente web + túneis WebSocket.
# Em produção, termine TLS aqui (certbot) e use wss:// no cliente.
server {
    listen 80;
    server_name _;

    # Cliente web (OTClient WebAssembly). COOP/COEP liberam SharedArrayBuffer.
    location /play/ {
        root /usr/share/nginx/html;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        types { application/wasm wasm; }
    }

    # O cliente web conecta em ws(s)://<host>/ws/login e /ws/game
    location /ws/login {
        proxy_pass http://ws-login:7271;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }
    location /ws/game {
        proxy_pass http://ws-game:7272;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 24h;
    }
}
